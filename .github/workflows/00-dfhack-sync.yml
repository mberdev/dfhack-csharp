name: 00 (AUTO) Monthly DFHack Proto Sync

on:
  schedule:
    - cron: "0 0 1 * *"   # Midnight on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # Required so git push works

jobs:
  update-protos:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo B with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Update dfhack submodule to latest commit
        run: |
          git submodule update --remote --init dfhack

      - name: Detect changes only in proto folders (skip on manual run)
        id: check_proto_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run detected — forcing regeneration"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGES=$(git diff --name-only HEAD | grep -E \
            "dfhack/library/proto/|dfhack/plugins/remotefortressreader/proto/" || true)

          if [[ -n "$CHANGES" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Proto changes detected:"
            echo "$CHANGES"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No proto changes detected"
          fi

      - name: Determine latest DFHack version from tags
        id: version
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          TAGS=$(git ls-remote --tags https://github.com/DFHack/dfhack.git | \
            awk -F'/' '{print $3}' | sed 's/\^{}//' )

          # Keep only tags that start with a digit (excludes v50.xxx style tags)
          # Sort numerically per component: treat -rN as a fourth dot-separated component
          LATEST=$(echo "$TAGS" | grep -E '^[0-9]' | \
            awk '{
              v = $0
              gsub(/-r/, ".", v)
              n = split(v, a, /\./)
              printf "%05d%05d%05d%05d %s\n", a[1]+0, a[2]+0, a[3]+0, a[4]+0, $0
            }' | sort | tail -n 1 | awk '{print $NF}')

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Detected DFHack version: $LATEST"

      ###############################################################
      # COPY ORIGINAL PROTO FILES USING MAPPING
      ###############################################################

      - name: Copy proto sources
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Define the two mappings
          MAPPING=(
            "dfhack/library/proto dfhack-$VERSION/proto/dfhack"
            "dfhack/plugins/remotefortressreader/proto dfhack-$VERSION/proto/remotefortressreader"
          )

          echo "See variable MAPPING in the workflow to add more source folders, or change their destination folders."

          for ENTRY in "${MAPPING[@]}"; do
            set -- $ENTRY
            SOURCE_PROTO="$1"
            OUTBASE="$2"

            echo "Copying proto files from $SOURCE_PROTO to $OUTBASE"

            mkdir -p "$OUTBASE"
            rm -rf "$OUTBASE" || true
            mkdir -p "$OUTBASE"
            cp "$SOURCE_PROTO"/*.proto "$OUTBASE"
          done

      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Proto sync for DFHack v${{ steps.version.outputs.version }}: copied proto files" || echo "No changes to commit"
          git push
