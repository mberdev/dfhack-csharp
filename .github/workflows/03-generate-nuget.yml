name: 03 (TRIGGERED) Generate NuGet Packages

on:
  workflow_run:
    workflows: ["02 (TRIGGERED) Generate C# After Generate rpcproto"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-nuget:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare nuget output folder
        run: |
          rm -rf nuget
          mkdir -p nuget

      - name: Generate NuGet packages for each dfhack-v* folder
        run: |
          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue

            echo "Processing $ROOT..."

            PKG_NAME="${ROOT}"
            VERSION="1.0.0"

            TMPDIR="tmp_nuget_${ROOT}"
            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"

            cp -r "$ROOT" "$TMPDIR/"

            {
              echo "<Project Sdk=\"Microsoft.NET.Sdk\">"
              echo "  <PropertyGroup>"
              echo "    <TargetFramework>netstandard2.1</TargetFramework>"
              echo "    <PackageId>${PKG_NAME}</PackageId>"
              echo "    <Version>${VERSION}</Version>"
              echo "    <Authors>DFHack Auto Generator</Authors>"
              echo "    <Description>Auto-generated NuGet package for ${ROOT}</Description>"
              echo "    <PackageOutputPath>../nuget</PackageOutputPath>"
              echo "    <IncludeBuildOutput>false</IncludeBuildOutput>"
              echo "  </PropertyGroup>"
              echo ""
              echo "  <ItemGroup>"
              echo "    <PackageReference Include=\"Google.Protobuf\" Version=\"3.25.3\" />"
              echo "    <PackageReference Include=\"Grpc.Core\" Version=\"2.46.6\" />"
              echo "  </ItemGroup>"
              echo ""
              echo "  <ItemGroup>"
              echo "    <Compile Include="${ROOT}/**/*.cs" Pack="true" PackagePath="contentFiles/cs/any/${ROOT}/" />"
              echo "    <None Include="${ROOT}/**/*" Exclude="${ROOT}/**/*.cs" Pack="true" PackagePath="${ROOT}/" />"
              echo "  </ItemGroup>"
              echo "</Project>"
            } > "$TMPDIR/${PKG_NAME}.csproj"

            dotnet pack "$TMPDIR/${PKG_NAME}.csproj" --configuration Release

            rm -rf "$TMPDIR"
          done

      - name: Move generated NuGet packages into repo folder
        run: |
          mkdir -p nuget
          find . -name "*.nupkg" -exec cp {} nuget/ \;


      - name: Commit generated NuGet packages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f nuget/*.nupkg
          git commit -m "Generated NuGet packages for all dfhack-v* folders" || echo "No changes to commit"
          git push

