name: 03 (TRIGGERED) Generate NuGet Packages

on:
  workflow_run:
    workflows: ["02 (TRIGGERED) Generate C# After Generate rpcproto"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-nuget:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare nuget output folder
        run: |
          rm -rf nuget
          mkdir -p nuget

      - name: Generate NuGet packages for each dfhack-v* folder
        run: |
          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue

            echo "Processing $ROOT..."

            PKG_NAME="${ROOT}"
            VERSION="1.0.0"

            TMPDIR="tmp_nuget_${ROOT}"
            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"

            cp -r "$ROOT" "$TMPDIR/"

            cat > "$TMPDIR/${PKG_NAME}.csproj" <<EOF
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <PackageId>${PKG_NAME}</PackageId>
                <Version>${VERSION}</Version>
                <Authors>DFHack Auto Generator</Authors>
                <Description>Auto-generated NuGet package for ${ROOT}</Description>
                <PackageOutputPath>../nuget</PackageOutputPath>
                <IncludeBuildOutput>false</IncludeBuildOutput>
              </PropertyGroup>

              <ItemGroup>
                <None Include="${ROOT}/**/*" Pack="true" PackagePath="${ROOT}/" />
              </ItemGroup>
            </Project>
            EOF

            dotnet pack "$TMPDIR/${PKG_NAME}.csproj" --configuration Release

            rm -rf "$TMPDIR"
          done

      - name: Commit generated NuGet packages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nuget
          git commit -m "Generated NuGet packages for all dfhack-v* folders" || echo "No changes to commit"
          git push
