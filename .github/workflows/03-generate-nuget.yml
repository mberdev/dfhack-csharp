name: 03 (TRIGGERED) Generate NuGet Packages

on:
  workflow_run:
    workflows: ["02 (TRIGGERED) Generate C# After Generate rpcproto"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-nuget:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate NuGet packages for each dfhack-v* folder
        run: |
          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue

            echo "Processing $ROOT..."

            PKG_NAME="${ROOT}"
            VERSION="1.0.0"

            # Correct nuget output folder
            mkdir -p "$ROOT/csharp/dfhack-csharp/nuget"

            TMPDIR="tmp_nuget_${ROOT}"
            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR/src"

            # Copy generated C# files from the correct location
            cp -r "$ROOT/csharp/dfhack-csharp/src/." "$TMPDIR/src/"

            # .csproj must live in TMPDIR/dfhack-csharp
            CSProjDir="$TMPDIR/dfhack-csharp"
            mkdir -p "$CSProjDir"
            CSProjPath="$CSProjDir/${PKG_NAME}.csproj"

            {
              echo "<Project Sdk=\"Microsoft.NET.Sdk\">"
              echo "  <PropertyGroup>"
              echo "    <TargetFramework>netstandard2.1</TargetFramework>"
              echo "    <PackageId>${PKG_NAME}</PackageId>"
              echo "    <Version>${VERSION}</Version>"
              echo "    <Authors>DFHack Auto Generator</Authors>"
              echo "    <Description>Auto-generated NuGet package for ${ROOT}</Description>"
              echo "    <PackageOutputPath>./nuget</PackageOutputPath>"
              echo "    <GenerateAssemblyInfo>true</GenerateAssemblyInfo>"
              echo "    <AssemblyName>${PKG_NAME}</AssemblyName>"
              echo "    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>"
              echo "    <Nullable>disable</Nullable>"
              echo "  </PropertyGroup>"
              echo "  <ItemGroup>"
              echo "    <PackageReference Include=\"Google.Protobuf\" Version=\"3.25.3\" />"
              echo "    <PackageReference Include=\"Grpc.Core\" Version=\"2.46.6\" />"
              echo "  </ItemGroup>"
              echo "  <ItemGroup>"
              echo "    <Compile Include=\"src/**/*.cs\" />"
              echo "  </ItemGroup>"
              echo "</Project>"
            } > "$CSProjPath"

            # Build + pack
            (
              cd "$TMPDIR"
              dotnet build "dfhack-csharp/${PKG_NAME}.csproj" --configuration Release
              dotnet pack  "dfhack-csharp/${PKG_NAME}.csproj" --configuration Release --no-build --output ./nuget
            )

            # Move .nupkg into correct folder
            mv "$TMPDIR/nuget/"*.nupkg "$ROOT/csharp/dfhack-csharp/nuget/" 2>/dev/null || true

            # Persist .csproj into dfhack-csharp/
            cp "$CSProjPath" "$ROOT/csharp/dfhack-csharp/${PKG_NAME}.csproj"

            # Generate .sln in csharp/
            dotnet new sln -n "${PKG_NAME}" --output "$ROOT/csharp" --force
            dotnet sln "$ROOT/csharp/${PKG_NAME}.sln" add "$ROOT/csharp/dfhack-csharp/${PKG_NAME}.csproj"

            rm -rf "$TMPDIR"
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f dfhack-v*/csharp/dfhack-csharp/nuget/
          git add -f dfhack-v*/csharp/dfhack-csharp/*.csproj
          git add -f dfhack-v*/csharp/*.sln

          git commit -m "Generated .sln, .csproj and NuGet packages" || echo "No changes to commit"
          git push
