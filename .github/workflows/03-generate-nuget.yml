name: 03 (TRIGGERED) Generate NuGet Packages

on:
  workflow_run:
    workflows: ["02 (TRIGGERED) Generate C# After Generate rpcproto"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-nuget:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          set -x
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      #######################################################################
      # 1. GENERATE ALL .csproj AND .sln FILES FIRST (NO PACKING YET)
      #######################################################################
      - name: Generate project + solution files
        run: |
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Processing $ROOT..."

            PKG_NAME="${ROOT}"
            VERSION="1.0.0"

            # Ensure folder structure exists
            mkdir -p "$ROOT/csharp"
            mkdir -p "$ROOT/csharp/dfhack-csharp"
            mkdir -p "$ROOT/csharp/dfhack-csharp/src"

            # Create .csproj
            CSProjPath="$ROOT/csharp/dfhack-csharp/${PKG_NAME}.csproj"

            {
              echo "<Project Sdk=\"Microsoft.NET.Sdk\">"
              echo "  <PropertyGroup>"
              echo "    <TargetFramework>netstandard2.1</TargetFramework>"
              echo "    <PackageId>${PKG_NAME}</PackageId>"
              echo "    <Version>${VERSION}</Version>"
              echo "    <Authors>DFHack Auto Generator</Authors>"
              echo "    <Description>Auto-generated NuGet package for ${ROOT}</Description>"
              echo "    <PackageOutputPath>./nuget</PackageOutputPath>"
              echo "    <GenerateAssemblyInfo>true</GenerateAssemblyInfo>"
              echo "    <AssemblyName>${PKG_NAME}</AssemblyName>"
              echo "    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>"
              echo "    <Nullable>disable</Nullable>"
              echo "  </PropertyGroup>"
              echo "  <ItemGroup>"
              echo "    <PackageReference Include=\"Google.Protobuf\" Version=\"3.25.3\" />"
              echo "    <PackageReference Include=\"Grpc.Core\" Version=\"2.46.6\" />"
              echo "  </ItemGroup>"
              echo "  <ItemGroup>"
              echo "    <Compile Include=\"src/**/*.cs\" />"
              echo "  </ItemGroup>"
              echo "</Project>"
            } > "$CSProjPath"

            # Generate .sln at $ROOT/csharp/ referencing the .csproj
            (
              set -x
              cd "$ROOT/csharp"
              dotnet new sln -n "${PKG_NAME}" --force
              dotnet sln "${PKG_NAME}.sln" add "dfhack-csharp/${PKG_NAME}.csproj"
            )


          done

      #######################################################################
      # 2. COMMIT PROJECT + SOLUTION FILES
      #######################################################################
      - name: Commit project + solution files
        run: |
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f dfhack-v*/csharp/dfhack-csharp/*.csproj
          git add -f dfhack-v*/csharp/*.sln

          git commit -m "Generated .csproj and .sln files" || echo "No changes to commit"
          git push

      #######################################################################
      # 3. BUILD + PACK NUGET PACKAGES (AFTER PROJECTS ARE COMMITTED)
      #######################################################################
      - name: Build + pack NuGet packages
        run: |
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue

            echo "Packing $ROOT..."

            PKG_NAME="${ROOT}"

            mkdir -p "$ROOT/csharp/dfhack-csharp/nuget"

            (
              set -x
              cd "$ROOT/csharp/dfhack-csharp"
              dotnet build "${PKG_NAME}.csproj" --configuration Release
              dotnet pack  "${PKG_NAME}.csproj" --configuration Release --no-build --output "./nuget"
            )

          done

      #######################################################################
      # 4. COMMIT NUGET PACKAGES
      #######################################################################
      - name: Commit NuGet packages
        run: |
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f dfhack-v*/csharp/dfhack-csharp/nuget/*.nupkg

          git commit -m "Generated NuGet packages" || echo "No changes to commit"
          git push
