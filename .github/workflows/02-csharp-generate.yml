name: 02 (TRIGGERED) Generate C# After Generate rpcproto

on:
  workflow_run:
    workflows: ["01 (TRIGGERED) Generate rpcproto After DFHack Proto Sync"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write   # Required so git push works

jobs:
  generate-csharp:
    # Run if:
    # - Started manually (workflow_dispatch), OR
    # - Started by workflow_run AND previous workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2   # Needed so we can diff against previous commit

      - name: Ensure branch is up to date
        run: |
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      ###############################################################
      # FIND ALL RPCPROTO FOLDERS ANYWHERE UNDER ANY dfhack-v* FOLDER
      # AND SELECT ONLY THOSE WHOSE SIBLING "Generated" FOLDER
      # IS MISSING OR EMPTY
      ###############################################################

      - name: Find rpcproto folders needing C# generation
        id: folders
        run: |
          NEEDS_GEN=""

          # Loop through all dfhack-v* folders
          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue

            # Find all subdirs under the rpcproto folder
            while read RPCPROTO_PATH; do
              [[ -z "$RPCPROTO_PATH" ]] && continue
              [[ "$RPCPROTO_PATH" == "$ROOT/rpcproto" ]] && continue

              PLUGIN=$(basename "$RPCPROTO_PATH")
              GEN="$ROOT/csharp/$PLUGIN"

              # Check if csharp folder is missing or empty
              if [[ ! -d "$GEN" ]] || [[ -z "$(ls -A "$GEN" 2>/dev/null)" ]]; then
                echo "Will generate C# for: $RPCPROTO_PATH"
                NEEDS_GEN="$NEEDS_GEN $RPCPROTO_PATH"
              else
                echo "Skipping $RPCPROTO_PATH (csharp exists and is not empty)"
              fi

            done < <(find "$ROOT/rpcproto" -type d)
          done

          if [[ -z "$NEEDS_GEN" ]]; then
            echo "none" > rpcproto_list.txt
            echo "folders=none" >> $GITHUB_OUTPUT
          else
            echo "$NEEDS_GEN" > rpcproto_list.txt
            echo "folders=$NEEDS_GEN" >> $GITHUB_OUTPUT
          fi



      - name: Stop if no C# generation is needed
        if: ${{ steps.folders.outputs.folders == 'none' }}
        run: |
          echo "No rpcproto folders require C# generation."
          exit 0


      ###############################################################
      # INSTALL PROTOC + gRPC C# PLUGIN
      ###############################################################

      - name: Install protoc and gRPC C# plugin
        run: |
          PROTOC_VERSION="27.2"

          # Install protoc
          curl -L -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo unzip protoc.zip -d /usr/local
          rm protoc.zip

          echo "protoc version:"
          protoc --version

          # Install grpc_csharp_plugin from Grpc.Tools NuGet package
          GRPC_VERSION="2.62.0"   # or whichever version you want

          # Download the NuGet package (it's just a ZIP file)
          curl -L -o Grpc.Tools.nupkg \
            "https://www.nuget.org/api/v2/package/Grpc.Tools/${GRPC_VERSION}"

          # Extract only the Linux x64 plugin
          unzip -j Grpc.Tools.nupkg \
            "tools/linux_x64/grpc_csharp_plugin" \
            -d /usr/local/bin/

          # Make it executable
          sudo chmod +x /usr/local/bin/grpc_csharp_plugin

          # Clean up
          rm Grpc.Tools.nupkg

          echo "grpc_csharp_plugin installed at:"
          which grpc_csharp_plugin



      ###############################################################
      # GENERATE C# FILES FOR EACH rpcproto FOLDER THAT NEEDS IT
      ###############################################################

      - name: Generate C# files
        run: |
          for RPCPROTO_PATH in $(cat rpcproto_list.txt); do
            [[ "$RPCPROTO_PATH" == "none" ]] && continue

            PLUGIN=$(basename "$RPCPROTO_PATH")
            ROOT=$(dirname $(dirname "$RPCPROTO_PATH"))

            DFHACK_PATH="$ROOT/rpcproto/dfhack"
            CSHARP_OUT="$ROOT/csharp/src/$PLUGIN"

            echo "Generating C# for:"
            echo "  Input proto folder:   $RPCPROTO_PATH"
            echo "  DFHack proto folder:  $DFHACK_PATH"
            echo "  Output folder:        $CSHARP_OUT"

            rm -rf "$CSHARP_OUT" || true
            mkdir -p "$CSHARP_OUT"

            protoc \
              --proto_path="$RPCPROTO_PATH" \
              --proto_path="$DFHACK_PATH" \
              --csharp_out="$CSHARP_OUT" \
              --grpc_out="$CSHARP_OUT" \
              --plugin=protoc-gen-grpc=$(which grpc_csharp_plugin) \
              "$RPCPROTO_PATH"/*.proto

          done


      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Generated C# files (messages + gRPC stubs) for all rpcproto folders missing a sibling /csharp folder" || echo "No changes to commit"
          git push
