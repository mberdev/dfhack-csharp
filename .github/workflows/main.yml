name: Monthly Proto Sync

on:
  schedule:
    - cron: "0 0 1 * *"   # Midnight on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # Required so git push works

jobs:
  update-protos:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo B with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update dfhack submodule to latest commit
        run: |
          git submodule update --remote --init dfhack

      - name: Detect changes only in proto folders (skip on manual run)
        id: check_proto_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run detected — forcing regeneration"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGES=$(git diff --name-only HEAD | grep -E \
            "dfhack/library/proto/|dfhack/plugins/remotefortressreader/proto/" || true)

          if [[ -n "$CHANGES" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Proto changes detected:"
            echo "$CHANGES"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No proto changes detected"
          fi

      - name: Determine latest DFHack version from tags
        id: version
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          TAGS=$(git ls-remote --tags https://github.com/DFHack/dfhack.git | \
            awk -F'/' '{print $3}' | sed 's/\^{}//' )

          LATEST=$(echo "$TAGS" | sort -V | tail -n 1)

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Detected DFHack version: $LATEST"

      - name: Install protoc (pinned version)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          PROTOC_VERSION="27.2"
          curl -L -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo unzip protoc.zip -d /usr/local
          rm protoc.zip
          protoc --version

      ###############################################################
      # PROCESS ALL FOLDERS
      ###############################################################

      - name: Process proto sources (dfhack + remotefortressreader)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Define the two mappings
          MAPPING=(
            "dfhack/library/proto dfhack-$VERSION/dfhack"
            "dfhack/plugins/remotefortressreader/proto dfhack-$VERSION/remotefortressreader"
          )

          for ENTRY in "${MAPPING[@]}"; do
            set -- $ENTRY
            SOURCE_PROTO="$1"
            OUTBASE="$2"

            echo "Processing source: $SOURCE_PROTO"
            echo "Output base: $OUTBASE"

            ###############################################################
            # 1. COPY ORIGINAL PROTO FILES
            ###############################################################
            mkdir -p "$OUTBASE/proto"
            rm -rf "$OUTBASE/proto" || true
            mkdir -p "$OUTBASE/proto"
            cp "$SOURCE_PROTO"/*.proto "$OUTBASE/proto"

            ###############################################################
            # 2. GENERATE RPCPROTO FILES
            ###############################################################
            rm -rf "$OUTBASE/rpcproto" || true
            mkdir -p "$OUTBASE/rpcproto"

            for FILE in "$OUTBASE/proto"/*.proto; do
              BASENAME=$(basename "$FILE")
              OUTFILE="$OUTBASE/rpcproto/$BASENAME"

              RPC_LINES=$(grep "// RPC" "$FILE" || true)

              # If no RPC lines, just copy original file with header
              if [[ -z "$RPC_LINES" ]]; then
                echo "// This file is autogenerated from the same .proto file located in /proto" > "$OUTFILE"
                cat "$FILE" >> "$OUTFILE"
                continue
              fi

              # Find the first "message " line
              FIRST_MESSAGE_LINE=$(grep -n -E '^[[:space:]]*message[[:space:]]+' "$FILE" | head -n 1 | cut -d: -f1)

              # Check if the line above the message is a comment
              PREV_LINE=$((FIRST_MESSAGE_LINE - 1))
              PREV_CONTENT=$(sed -n "${PREV_LINE}p" "$FILE")

              if [[ "$PREV_CONTENT" =~ ^[[:space:]]*// ]]; then
                INSERT_LINE=$PREV_LINE
              else
                INSERT_LINE=$FIRST_MESSAGE_LINE
              fi

              echo "// This file is autogenerated from the same .proto file located in /proto" > "$OUTFILE"

              # Everything before the insertion point
              head -n $((INSERT_LINE - 1)) "$FILE" >> "$OUTFILE"
              echo >> "$OUTFILE"

              # Insert service block
              echo "service RpcService {" >> "$OUTFILE"
              while read -r LINE; do
                METHOD=$(echo "$LINE" | sed -E 's|.*RPC ([^: ]+).*|\1|')
                INPUT=$(echo "$LINE"  | sed -E 's|.*: ([^ ]+) ->.*|\1|')
                OUTPUT=$(echo "$LINE" | sed -E 's|.*-> ([^ ]+).*|\1|')
                echo "  rpc $METHOD ($INPUT) returns ($OUTPUT);" >> "$OUTFILE"
              done <<< "$RPC_LINES"
              echo "}" >> "$OUTFILE"
              echo >> "$OUTFILE"

              # Everything from the insertion point onward
              tail -n +"$INSERT_LINE" "$FILE" >> "$OUTFILE"
            done

            ###############################################################
            # 3. GENERATE C# FILES
            ###############################################################
            rm -rf "$OUTBASE/Generated" || true
            mkdir -p "$OUTBASE/Generated"

            protoc \
              --csharp_out="$OUTBASE/Generated" \
              --proto_path="$SOURCE_PROTO" \
              "$SOURCE_PROTO"/*.proto

          done

      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Proto sync for DFHack v${{ steps.version.outputs.version }}: regenerated C#, copied proto, generated rpcproto" || echo "No changes to commit"
          git push
