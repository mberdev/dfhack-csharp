name: Monthly Proto Sync

on:
  schedule:
    - cron: "0 0 1 * *"   # Midnight on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # Required so git push works

jobs:
  update-protos:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo B with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update dfhack submodule to latest commit
        run: |
          git submodule update --remote --init dfhack

      - name: Detect changes only in proto folders (skip on manual run)
        id: check_proto_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run detected — forcing regeneration"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGES=$(git diff --name-only HEAD | grep -E \
            "dfhack/library/proto/|dfhack/plugins/remotefortressreader/proto/" || true)

          if [[ -n "$CHANGES" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Proto changes detected:"
            echo "$CHANGES"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No proto changes detected"
          fi

      - name: Determine latest DFHack version from tags
        id: version
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          TAGS=$(git ls-remote --tags https://github.com/DFHack/dfhack.git | \
            awk -F'/' '{print $3}' | sed 's/\^{}//' )

          LATEST=$(echo "$TAGS" | sort -V | tail -n 1)

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Detected DFHack version: $LATEST"

      - name: Install protoc (pinned version)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          PROTOC_VERSION="27.2"
          curl -L -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo unzip protoc.zip -d /usr/local
          rm protoc.zip
          protoc --version

      ###############################################################
      # COPY ORIGINAL PROTO FILES
      ###############################################################

      - name: Copy proto files (dfhack/library/proto)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEST="dfhack-$VERSION/dfhack/proto"
          mkdir -p "$DEST"
          cp dfhack/library/proto/*.proto "$DEST"

      - name: Copy proto files (dfhack/plugins/remotefortressreader/proto)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEST="dfhack-$VERSION/remotefortressreader/proto"
          mkdir -p "$DEST"
          cp dfhack/plugins/remotefortressreader/proto/*.proto "$DEST"

      ###############################################################
      # CREATE RPCPROTO FOLDERS + CONVERT RPC COMMENTS TO SERVICE SYNTAX
      ###############################################################

      - name: Convert proto files to RPC-enabled versions (dfhack)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC="dfhack-$VERSION/dfhack/proto"
          DEST="dfhack-$VERSION/dfhack/rpcproto"
          mkdir -p "$DEST"

          for FILE in "$SRC"/*.proto; do
            BASENAME=$(basename "$FILE")
            OUTFILE="$DEST/$BASENAME"

            # Start with a clean file
            echo "" > "$OUTFILE"

            # Copy original content except RPC comments
            grep -v "// RPC" "$FILE" >> "$OUTFILE"

            # Extract RPC lines
            RPC_LINES=$(grep "// RPC" "$FILE" || true)

            if [[ -n "$RPC_LINES" ]]; then
              echo >> "$OUTFILE"
              echo "service RpcService {" >> "$OUTFILE"

              while read -r LINE; do
                METHOD=$(echo "$LINE" | sed -E 's|.*RPC ([^: ]+).*|\1|')
                INPUT=$(echo "$LINE"  | sed -E 's|.*: ([^ ]+) ->.*|\1|')
                OUTPUT=$(echo "$LINE" | sed -E 's|.*-> ([^ ]+).*|\1|')

                echo "  rpc $METHOD ($INPUT) returns ($OUTPUT);" >> "$OUTFILE"
              done <<< "$RPC_LINES"

              echo "}" >> "$OUTFILE"
            fi
          done


      - name: Convert proto files to RPC-enabled versions (remotefortressreader)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC="dfhack-$VERSION/remotefortressreader/proto"
          DEST="dfhack-$VERSION/remotefortressreader/rpcproto"
          mkdir -p "$DEST"

          for FILE in "$SRC"/*.proto; do
            BASENAME=$(basename "$FILE")
            OUTFILE="$DEST/$BASENAME"

            # Start with a clean file
            echo "" > "$OUTFILE"

            grep -v "// RPC" "$FILE" >> "$OUTFILE"

            RPC_LINES=$(grep "// RPC" "$FILE" || true)

            if [[ -n "$RPC_LINES" ]]; then
              echo >> "$OUTFILE"
              echo "service RpcService {" >> "$OUTFILE"

              while read -r LINE; do
                METHOD=$(echo "$LINE" | sed -E 's|.*RPC ([^: ]+).*|\1|')
                INPUT=$(echo "$LINE"  | sed -E 's|.*: ([^ ]+) ->.*|\1|')
                OUTPUT=$(echo "$LINE" | sed -E 's|.*-> ([^ ]+).*|\1|')

                echo "  rpc $METHOD ($INPUT) returns ($OUTPUT);" >> "$OUTFILE"
              done <<< "$RPC_LINES"

              echo "}" >> "$OUTFILE"
            fi
          done



      ###############################################################
      # GENERATE C# FILES FROM ORIGINAL PROTO SOURCES
      ###############################################################

      - name: Generate C# files (dfhack/library/proto)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT="dfhack-$VERSION/dfhack/Generated"
          mkdir -p "$OUT"

          SRC="dfhack/library/proto"
          protoc \
            --csharp_out="$OUT" \
            --proto_path="$SRC" \
            $SRC/*.proto

      - name: Generate C# files (dfhack/plugins/remotefortressreader/proto)
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT="dfhack-$VERSION/remotefortressreader/Generated"
          mkdir -p "$OUT"

          SRC="dfhack/plugins/remotefortressreader/proto"
          protoc \
            --csharp_out="$OUT" \
            --proto_path="$SRC" \
            $SRC/*.proto

      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        if: steps.check_proto_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Proto sync for DFHack v${{ steps.version.outputs.version }}: regenerated C#, copied proto, generated rpcproto" || echo "No changes to commit"
          git push
