name: 04 (TRIGGERED) Generate Example Project

on:
  workflow_run:
    workflows: ["03 (TRIGGERED) Generate NuGet Packages"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-example:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          set -euo pipefail
          set -x
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate example project
        run: |
          set -euo pipefail
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Processing $ROOT..."

            CSHARP_DIR="$ROOT/csharp"
            EXAMPLE_DIR="$CSHARP_DIR/HandshakeExample"

            mkdir -p "$EXAMPLE_DIR"

            ###################################################################
            # HandshakeExample.csproj — no external packages needed, only System.*
            ###################################################################
            {
              echo "<Project Sdk=\"Microsoft.NET.Sdk\">"
              echo "  <PropertyGroup>"
              echo "    <OutputType>Exe</OutputType>"
              echo "    <TargetFramework>net8.0</TargetFramework>"
              echo "    <Nullable>disable</Nullable>"
              echo "  </PropertyGroup>"
              echo "</Project>"
            } > "$EXAMPLE_DIR/HandshakeExample.csproj"

            ###################################################################
            # Program.cs
            ###################################################################
            {
              echo "using System;"
              echo "using System.Collections.Generic;"
              echo "using System.Net.Sockets;"
              echo "using System.Text;"
              echo ""
              echo "string DFHackHandshakeRequest = \"DFHack?\\n\";"
              echo "string DFHackHandshakeReply = \"DFHack!\\n\";"
              echo ""
              echo ""
              echo "//var host = \"localhost\";"
              echo "var host = \"127.0.0.1\";"
              echo "//var host = \"::1\";"
              echo ""
              echo "int port = 5000;"
              echo ""
              echo "Console.WriteLine(\$\"Connecting socket to host '{host}' on port {port}...\");"
              echo ""
              echo "var socket = new Socket(AddressFamily.InterNetwork, SocketType.Stream, ProtocolType.Tcp);"
              echo "try"
              echo "{"
              echo "    socket.Connect(host, 5000);"
              echo "} catch (SocketException){"
              echo "    Console.WriteLine(\"Could not connect socket)\");"
              echo "    return;"
              echo "}"
              echo ""
              echo "Console.WriteLine(\"Connection successful.\");"
              echo ""
              echo "var headerList = new List<byte>();"
              echo "headerList.AddRange(Encoding.ASCII.GetBytes(DFHackHandshakeRequest)); // See DFHack's handshake documentation"
              echo "headerList.AddRange(BitConverter.GetBytes(1)); // 1 -> [1, 0, 0, 0]. Supposed to be DFHack's protocol version, on 4 bytes. See DFHack's handshake documentation"
              echo "byte[] header = headerList.ToArray();"
              echo ""
              echo "Console.WriteLine(\"Sending DFHack header and version...\");"
              echo ""
              echo "if (socket.Send(header) != header.Length)"
              echo "{"
              echo "    Console.WriteLine(\"Could not send handshake header.\\n\");"
              echo "    return;"
              echo "}"
              echo ""
              echo "Console.WriteLine(\"Sent successfully.\");"
              echo "Console.WriteLine(\"Receiving DFHack's response and protocol version...\");"
              echo ""
              echo "// Read the hanshake reply magic word"
              echo "byte[] replyBuffer = new byte[DFHackHandshakeReply.Length];"
              echo "int received = 0;"
              echo "while (received < replyBuffer.Length)"
              echo "{"
              echo "    int cnt = socket.Receive(replyBuffer, received, replyBuffer.Length - received, SocketFlags.None);"
              echo "    if (cnt <= 0) break;"
              echo "    received += cnt;"
              echo "}"
              echo ""
              echo "if (Encoding.ASCII.GetString(replyBuffer) != DFHackHandshakeReply)"
              echo "{"
              echo "    Console.WriteLine(\"Handshake reply mismatch. Expected: \" + DFHackHandshakeReply.Replace(\"\\n\", \"\\\\n\") + \", got: \" + Encoding.ASCII.GetString(replyBuffer).Replace(\"\\n\", \"\\\\n\"));"
              echo "    return;"
              echo "}"
              echo ""
              echo ""
              echo "// Read 4 more bytes. Assembled together (as an int32) they're supposed to be DFHack's protocol version. See documentation"
              echo "byte[] versionBuf = new byte[4];"
              echo "int versionReceived = 0;"
              echo "while (versionReceived < versionBuf.Length)"
              echo "{"
              echo "    int cnt = socket.Receive(versionBuf, versionReceived, versionBuf.Length - versionReceived, SocketFlags.None);"
              echo "    if (cnt <= 0) return;"
              echo "    versionReceived += cnt;"
              echo "}"
              echo ""
              echo "if (versionBuf[0] != 1 || versionBuf[1] != 0 || versionBuf[2] != 0 || versionBuf[3] != 0) // Version [1,0,0,0] (i.e., version 1)"
              echo "{"
              echo "    Console.WriteLine(\$\"Unexpected protocol version: [{versionBuf[0]}, {versionBuf[1]}, {versionBuf[2]}, {versionBuf[3]}]\");"
              echo "    return;"
              echo "}"
              echo ""
              echo "Console.WriteLine(\"DFHack replied what we expected.\");"
              echo ""
              echo ""
              echo "Console.WriteLine(\"\\nThis example program successfuly connected to DFHack and it responded!\");"
              echo ""
              echo ""
              echo "socket.Close();"
            } > "$EXAMPLE_DIR/Program.cs"

            ###################################################################
            # Add HandshakeExample project to the existing solution
            ###################################################################
            SOLUTION_FILE=$(ls "$CSHARP_DIR"/dfhack-csharp.sln* | head -n 1)
            echo "Adding HandshakeExample to solution: $SOLUTION_FILE"
            dotnet sln "$SOLUTION_FILE" add "$EXAMPLE_DIR/HandshakeExample.csproj"


          done

      - name: Commit example project
        run: |
          set -euo pipefail
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add dfhack-v*/csharp/HandshakeExample/
          git add -f dfhack-v*/csharp/*.sln*

          git commit -m "Generated HandshakeExample console app" || echo "No changes to commit"
          git push
