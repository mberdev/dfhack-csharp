name: 04 (TRIGGERED) Generate Example Project

on:
  workflow_run:
    workflows: ["03 (TRIGGERED) Generate NuGet Packages"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-example:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          set -euo pipefail
          set -x
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate example project
        run: |
          set -euo pipefail
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Processing $ROOT..."

            CSHARP_DIR="$ROOT/csharp"
            EXAMPLE_DIR="$CSHARP_DIR/example"

            mkdir -p "$EXAMPLE_DIR"

            ###################################################################
            # NuGet.config — points to the local nuget folder so the example
            # project can restore the dfhack-csharp package without a feed
            ###################################################################
            {
              echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
              echo "<configuration>"
              echo "  <packageSources>"
              echo "    <add key=\"dfhack-local\" value=\"dfhack-csharp/nuget\" />"
              echo "  </packageSources>"
              echo "</configuration>"
            } > "$CSHARP_DIR/NuGet.config"

            ###################################################################
            # example.csproj
            ###################################################################
            {
              echo "<Project Sdk=\"Microsoft.NET.Sdk\">"
              echo "  <PropertyGroup>"
              echo "    <OutputType>Exe</OutputType>"
              echo "    <TargetFramework>net8.0</TargetFramework>"
              echo "    <Nullable>disable</Nullable>"
              echo "  </PropertyGroup>"
              echo "  <ItemGroup>"
              echo "    <PackageReference Include=\"dfhack-csharp\" Version=\"1.0.0\" />"
              echo "  </ItemGroup>"
              echo "</Project>"
            } > "$EXAMPLE_DIR/example.csproj"

            ###################################################################
            # Program.cs
            ###################################################################
            {
              echo "using Grpc.Core;"
              echo "using Dfproto;"
              echo "using System;"
              echo ""
              echo ""
              echo "try"
              echo "{"
              echo "    var channel = new Channel(\"localhost\", 5000, ChannelCredentials.Insecure);"
              echo "    var client = new BasicApiRpcService.BasicApiRpcServiceClient(channel);"
              echo ""
              echo "    var version = client.GetVersion(new EmptyMessage());"
              echo "    Console.WriteLine(\"Succesffully called method 'GetVersion' of DFHack.\");"
              echo "    Console.WriteLine(\"DFHack version: \" + version.Value);"
              echo ""
              echo "    await channel.ShutdownAsync();"
              echo "}"
              echo "catch (Grpc.Core.RpcException ex)"
              echo "{"
              echo "    Console.WriteLine(\"Failed to call DFHack.\");"
              echo "    Console.WriteLine(\"Make sure that Dwarf Fortress is currently running and that the version of DFHack that matches this library is installed on DF and is enabled.\");"
              echo "    Console.WriteLine(\"\");"
              echo "    Console.WriteLine(\"Details:\");"
              echo "    Console.WriteLine(ex.Status.Detail);"
              echo "}"
            } > "$EXAMPLE_DIR/Program.cs"

            ###################################################################
            # Add example project to the existing solution, then reorder
            # so it appears first (startup project)
            ###################################################################
            SOLUTION_FILE=$(ls "$CSHARP_DIR"/dfhack-csharp.sln* | head -n 1)
            echo "Adding example to solution: $SOLUTION_FILE"
            dotnet sln "$SOLUTION_FILE" add "$EXAMPLE_DIR/example.csproj"

            # Reorder: extract both Project lines and write example first
            EXAMPLE_LINE=$(grep 'example.csproj' "$SOLUTION_FILE")
            LIB_LINE=$(grep 'dfhack-csharp.csproj' "$SOLUTION_FILE")
            {
              echo "<Solution>"
              echo "$EXAMPLE_LINE"
              echo "$LIB_LINE"
              echo "</Solution>"
            } > "$SOLUTION_FILE"

          done

      - name: Commit example project
        run: |
          set -euo pipefail
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add dfhack-v*/csharp/example/
          git add dfhack-v*/csharp/NuGet.config
          git add -f dfhack-v*/csharp/*.sln*

          git commit -m "Generated example console app" || echo "No changes to commit"
          git push
