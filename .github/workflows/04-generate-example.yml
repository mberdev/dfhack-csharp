name: 04 (TRIGGERED) Generate Example Project

on:
  workflow_run:
    workflows: ["03 (TRIGGERED) Generate NuGet Packages"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-example:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          set -euo pipefail
          set -x
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate example project
        run: |
          set -euo pipefail
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Processing $ROOT..."

            CSHARP_DIR="$ROOT/csharp"
            EXAMPLE_DIR="$CSHARP_DIR/example"

            mkdir -p "$EXAMPLE_DIR"

            ###################################################################
            # NuGet.config — points to the local nuget folder so the example
            # project can restore the dfhack-csharp package without a feed
            ###################################################################
            cat > "$CSHARP_DIR/NuGet.config" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <packageSources>
    <add key="dfhack-local" value="dfhack-csharp/nuget" />
  </packageSources>
</configuration>
EOF

            ###################################################################
            # example.csproj
            ###################################################################
            cat > "$EXAMPLE_DIR/example.csproj" << 'EOF'
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net8.0</TargetFramework>
    <Nullable>disable</Nullable>
  </PropertyGroup>
  <ItemGroup>
    <PackageReference Include="dfhack-csharp" Version="1.0.0" />
  </ItemGroup>
</Project>
EOF

            ###################################################################
            # Program.cs
            ###################################################################
            cat > "$EXAMPLE_DIR/Program.cs" << 'EOF'
using Grpc.Core;
using Dfproto;

var channel = new Channel("localhost", 5000, ChannelCredentials.Insecure);
var client = new BasicApiRpcService.BasicApiRpcServiceClient(channel);

var version = client.GetVersion(new EmptyMessage());
Console.WriteLine("DFHack version: " + version.Value);

await channel.ShutdownAsync();
EOF

            ###################################################################
            # Add example project to the existing solution
            ###################################################################
            SOLUTION_FILE=$(ls "$CSHARP_DIR"/dfhack-csharp.sln* | head -n 1)
            echo "Adding example to solution: $SOLUTION_FILE"
            dotnet sln "$SOLUTION_FILE" add "$EXAMPLE_DIR/example.csproj"

          done

      - name: Commit example project
        run: |
          set -euo pipefail
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add dfhack-v*/csharp/example/
          git add dfhack-v*/csharp/NuGet.config
          git add -f dfhack-v*/csharp/*.sln*

          git commit -m "Generated example console app" || echo "No changes to commit"
          git push
