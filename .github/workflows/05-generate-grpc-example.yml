name: 05 (TRIGGERED) Generate gRPC Example Project

on:
  workflow_run:
    workflows: ["04 (TRIGGERED) Generate Socket Example Project"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-grpc-example:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure branch is up to date
        run: |
          set -euo pipefail
          set -x
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Copy GrpcHandshakeExample template and add to solution
        run: |
          set -euo pipefail
          set -x

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Processing $ROOT..."

            CSHARP_DIR="$ROOT/csharp"
            DEST="$CSHARP_DIR/GrpcHandshakeExample"

            cp -r templates/GrpcHandshakeExample "$DEST"

            SOLUTION_FILE=$(ls "$CSHARP_DIR"/dfhack-csharp.sln* | head -n 1)
            echo "Adding GrpcHandshakeExample to solution: $SOLUTION_FILE"
            dotnet sln "$SOLUTION_FILE" add "$DEST/GrpcHandshakeExample.csproj"
          done

      - name: Commit GrpcHandshakeExample
        run: |
          set -euo pipefail
          set -x
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add dfhack-v*/csharp/GrpcHandshakeExample/
          git add -f dfhack-v*/csharp/*.sln*

          git commit -m "Generated GrpcHandshakeExample console app" || echo "No changes to commit"
          git push
