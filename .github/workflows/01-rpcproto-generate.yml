name: 01 (TRIGGERED) Generate rpcproto After DFHack Proto Sync

on:
  workflow_run:
    workflows: ["00 (AUTO) Monthly DFHack Proto Sync"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write   # Required so git push works

jobs:
  generate-rpcproto:
    # Run if:
    # - Started manually (workflow_dispatch), OR
    # - Started by workflow_run AND previous workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo on main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3


      - name: Ensure branch is up to date
        run: |
          echo "DEBUG: step started"
          git fetch origin main
          git checkout main
          git pull origin main --rebase

      - name: Install protoc (pinned version)
        run: |
          PROTOC_VERSION="27.2"
          curl -L -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo unzip protoc.zip -d /usr/local
          rm protoc.zip
          protoc --version

      ###############################################################
      # DETECT ALL /proto FOLDERS ANYWHERE UNDER dfhack-v*
      # AND CHECK WHETHER THEIR SIBLING /rpcproto FOLDER
      # IS MISSING OR EMPTY
      ###############################################################

      - name: Find proto folders needing rpcproto generation
        id: folders
        run: |
          set -euo pipefail
          set -x
          NEEDS_GEN=""

          for ROOT in dfhack-v*; do
            [[ -d "$ROOT" ]] || continue
            echo "Checking $ROOT..."

            if [[ ! -d "$ROOT/proto" ]]; then
              echo "No proto/ directory found under $ROOT — skipping"
              continue
            fi

            # -mindepth 1 -maxdepth 1 gives only direct subdirectories of proto/,
            # so we never see the root proto/ itself and don't need to skip it.
            while IFS= read -r PROTO_DIR; do
              PLUGIN=$(basename "$PROTO_DIR")
              RPCPROTO="$ROOT/rpcproto/$PLUGIN"

              if [[ ! -d "$RPCPROTO" ]] || [[ -z "$(ls -A "$RPCPROTO" 2>/dev/null)" ]]; then
                echo "Will generate rpcproto for: $PROTO_DIR"
                NEEDS_GEN="$NEEDS_GEN $PROTO_DIR"
              else
                echo "Skipping $PROTO_DIR (rpcproto exists and is not empty)"
              fi
            done < <(find "$ROOT/proto" -mindepth 1 -maxdepth 1 -type d)
          done

          # Trim whitespace before testing emptiness
          NEEDS_GEN_TRIMMED="${NEEDS_GEN// /}"
          if [[ -z "$NEEDS_GEN_TRIMMED" ]]; then
            echo "none" > proto_list.txt
            echo "folders=none" >> "$GITHUB_OUTPUT"
          else
            echo "$NEEDS_GEN" > proto_list.txt
            echo "folders=$NEEDS_GEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no rpcproto generation is needed
        if: ${{ steps.folders.outputs.folders == 'none' }}
        run: |
          echo "No proto folders require rpcproto generation."
          exit 0

      ###############################################################
      # GENERATE /rpcproto FOR ALL DETECTED FOLDERS
      ###############################################################

      - name: Generate rpcproto files
        if: ${{ steps.folders.outputs.folders != 'none' }}
        run: |
          # Define missing imports (filename + import)
          MISSING_IMPORTS=(
            "BasicApi.proto CoreProtocol.proto"
            "RemoteFortressReader.proto CoreProtocol.proto"
            "DwarfControl.proto CoreProtocol.proto"
          )

          # Define RPC commands to exclude from generation (until AdventureControl and RemoteFortressReader fix their cyclic types dependency)
          COMMANDS_TO_EXCLUDE=(
            "MoveCommand"
            "JumpCommand"
            "MenuQuery"
            "MovementSelectCommand"
            "MiscMoveCommand"
            "GetLanguage"
            "GetGameValidity"
          )


          for PROTO_PATH in $(cat proto_list.txt); do
            [[ "$PROTO_PATH" == "none" ]] && continue

            #################################################################
            # FIND dfhack-vXXX folder 
            #################################################################

            CURRENT_DFHACK_ROOT=""

            PATH_PARTS="$PROTO_PATH"

            while [[ "$PATH_PARTS" != "." && "$PATH_PARTS" != "/" && -n "$PATH_PARTS" ]]; do
              BASENAME=$(basename "$PATH_PARTS")

              if [[ "$BASENAME" == dfhack-v* ]]; then
                CURRENT_DFHACK_ROOT="$PATH_PARTS"
                break
              fi

              PATH_PARTS=$(dirname "$PATH_PARTS")
            done

            if [[ -z "$CURRENT_DFHACK_ROOT" ]]; then
              echo "ERROR: Could not find a dfhack-v* root folder above $FILE"
              exit 1
            fi

            echo "dfhack folder is: $CURRENT_DFHACK_ROOT"

            #################################################################
            # PROCESS FOLDER
            #################################################################

            PLUGIN=$(basename "$PROTO_PATH")
            RPCPROTO="$CURRENT_DFHACK_ROOT/rpcproto/$PLUGIN"

            echo "Generating rpcproto for:"
            echo "  Input proto folder: $PROTO_PATH"
            echo "  Output folder:      $RPCPROTO"

            rm -rf "$RPCPROTO" || true
            mkdir -p "$RPCPROTO"

            for FILE in "$PROTO_PATH"/*.proto; do
              BASENAME=$(basename "$FILE")
              OUTFILE="$RPCPROTO/$BASENAME"

              RPC_LINES=$(grep "// RPC" "$FILE" || true)

              HEADER0="// ==== THIS FILE IS AUTO-GENERATED. DO NOT EDIT. ==="
              HEADER1="// This file is a slightly improved version of the same .proto file located in /proto. It is autogenerated."
              HEADER2="// The only differences are: 1) Added some missing imports. 2) Added 'service' block (based on '// RPC' comments, if any)."
              HEADER3="// =================================================="

              ###############################################################
              # CHECK IF THIS FILE REQUIRES A MANUAL IMPORT FIX
              ###############################################################
              EXTRA_IMPORT=""
              EXTRA_IMPORT_NAME=""
              for ENTRY in "${MISSING_IMPORTS[@]}"; do
                set -- $ENTRY
                TARGET_FILE="$1"
                IMPORT_NAME="$2"

                if [[ "$TARGET_FILE" == "$BASENAME" ]]; then
                  EXTRA_IMPORT="import \"$IMPORT_NAME\"; // Manual fix by workflow. See workflow variable MISSING_IMPORTS."
                  EXTRA_IMPORT_NAME="$IMPORT_NAME"
                fi
              done

              ###############################################################
              # CASE 1: NO RPC LINES → JUST COPY WITH HEADER + OPTIONAL IMPORT
              ###############################################################
              if [[ -z "$RPC_LINES" ]]; then
                echo "$HEADER0" > "$OUTFILE"
                echo "$HEADER1" >> "$OUTFILE"
                echo "$HEADER2" >> "$OUTFILE"
                echo "$HEADER3" >> "$OUTFILE"

                LAST_IMPORT_LINE=$(grep -n '^import "' "$FILE" | tail -n 1 | cut -d: -f1)

                if [[ -n "$EXTRA_IMPORT" ]]; then
                  echo "Added missing import \"$EXTRA_IMPORT_NAME\" to $BASENAME (See workflow variable MISSING_IMPORTS)"

                  if [[ -n "$LAST_IMPORT_LINE" ]]; then
                    head -n "$LAST_IMPORT_LINE" "$FILE" >> "$OUTFILE"
                    echo "$EXTRA_IMPORT" >> "$OUTFILE"
                    tail -n +"$((LAST_IMPORT_LINE+1))" "$FILE" >> "$OUTFILE"
                  else
                    echo "$EXTRA_IMPORT" >> "$OUTFILE"
                    cat "$FILE" >> "$OUTFILE"
                  fi
                else
                  cat "$FILE" >> "$OUTFILE"
                fi

                continue
              fi

              ###############################################################
              # CASE 2: FILE HAS RPC LINES → FULL REWRITE WITH SERVICE BLOCK
              ###############################################################

              echo "$HEADER0" > "$OUTFILE"
              echo "$HEADER1" >> "$OUTFILE"
              echo "$HEADER2" >> "$OUTFILE"
              echo "$HEADER3" >> "$OUTFILE"

              # Split file into BEFORE_IMPORTS / IMPORT_BLOCK / AFTER_IMPORTS
              IMPORT_LINES=$(grep -n '^import "' "$FILE" | cut -d: -f1)

              if [[ -n "$IMPORT_LINES" ]]; then
                FIRST_IMPORT=$(echo "$IMPORT_LINES" | head -n 1)
                LAST_IMPORT=$(echo "$IMPORT_LINES" | tail -n 1)

                BEFORE_IMPORTS=$(head -n $((FIRST_IMPORT - 1)) "$FILE")
                IMPORT_BLOCK=$(sed -n "${FIRST_IMPORT},${LAST_IMPORT}p" "$FILE")
                AFTER_IMPORTS=$(tail -n +"$((LAST_IMPORT + 1))" "$FILE")
              else
                BEFORE_IMPORTS=$(cat "$FILE")
                IMPORT_BLOCK=""
                AFTER_IMPORTS=""
              fi

              # Write BEFORE_IMPORTS
              echo "$BEFORE_IMPORTS" >> "$OUTFILE"

              # Write IMPORT_BLOCK
              if [[ -n "$IMPORT_BLOCK" ]]; then
                echo "$IMPORT_BLOCK" >> "$OUTFILE"
              fi

              # Insert missing import
              if [[ -n "$EXTRA_IMPORT" ]]; then
                echo "Added missing import \"$EXTRA_IMPORT_NAME\" to $BASENAME"
                echo "$EXTRA_IMPORT" >> "$OUTFILE"
              fi

              echo >> "$OUTFILE"

              # Insert service block
              SERVICE_NAME="$(basename "$FILE" .proto)RpcService"
              echo "service $SERVICE_NAME {" >> "$OUTFILE"

              while read -r LINE; do
                METHOD=$(echo "$LINE" | sed -E 's|.*RPC ([^: ]+).*|\1|')
                INPUT=$(echo "$LINE"  | sed -E 's|.*: ([^ ]+) ->.*|\1|')
                OUTPUT=$(echo "$LINE" | sed -E 's|.*-> ([^ ]+).*|\1|')

                ###############################################################
                # FIND INPUT PACKAGE
                ###############################################################
                INPUT_PACKAGE=""

                # Search all .proto files under CURRENT_DFHACK_ROOT
                while read -r CANDIDATE; do
                  # Skip non-regular files just in case
                  [[ -f "$CANDIDATE" ]] || continue

                  # Does this file define the message we're looking for?
                  if grep -qE "^[[:space:]]*message[[:space:]]+$INPUT\b" "$CANDIDATE"; then
                    # Extract the package line
                    PKG_LINE=$(grep -E "^[[:space:]]*package[[:space:]]+[^;]+;" "$CANDIDATE" || true)
                    if [[ -z "$PKG_LINE" ]]; then
                      echo "ERROR: Could not find package for message '$INPUT' in file '$CANDIDATE'"
                      exit 1
                    fi

                    # Extract just the package name
                    INPUT_PACKAGE=$(echo "$PKG_LINE" | sed -E 's/^[[:space:]]*package[[:space:]]+([^;]+);/\1/')
                    break
                  fi
                done < <(find "$CURRENT_DFHACK_ROOT" -type f -name "*.proto")

                if [[ -z "$INPUT_PACKAGE" ]]; then
                  echo "ERROR: Could not locate message definition for '$INPUT' under $CURRENT_DFHACK_ROOT"
                  exit 1
                fi


                ###############################################################
                # FIND OUTPUT PACKAGE
                ###############################################################
                OUTPUT_PACKAGE=""

                # Search all .proto files under CURRENT_DFHACK_ROOT
                while read -r CANDIDATE; do
                  # Skip non-regular files just in case
                  [[ -f "$CANDIDATE" ]] || continue

                  # Does this file define the message we're looking for?
                  if grep -qE "^[[:space:]]*message[[:space:]]+$OUTPUT\b" "$CANDIDATE"; then
                    # Extract the package line
                    PKG_LINE=$(grep -E "^[[:space:]]*package[[:space:]]+[^;]+;" "$CANDIDATE" || true)
                    if [[ -z "$PKG_LINE" ]]; then
                      echo "ERROR: Could not find package for message '$OUTPUT' in file '$CANDIDATE'"
                      exit 1
                    fi

                    # Extract just the package name
                    OUTPUT_PACKAGE=$(echo "$PKG_LINE" | sed -E 's/^[[:space:]]*package[[:space:]]+([^;]+);/\1/')
                    break
                  fi
                done < <(find "$CURRENT_DFHACK_ROOT" -type f -name "*.proto")

                if [[ -z "$OUTPUT_PACKAGE" ]]; then
                  echo "ERROR: Could not locate message definition for '$OUTPUT' under $CURRENT_DFHACK_ROOT"
                  exit 1
                fi

                ###############################################################
                # WRITE RPC LINE WITH PACKAGE PREFIXES (WITH EXCLUSION SUPPORT)
                ###############################################################

                # Check if METHOD is in COMMANDS_TO_EXCLUDE
                EXCLUDED="false"
                for EX in "${COMMANDS_TO_EXCLUDE[@]}"; do
                  if [[ "$EX" == "$METHOD" ]]; then
                    EXCLUDED="true"
                    break
                  fi
                done

                if [[ "$EXCLUDED" == "true" ]]; then
                  # Commented-out RPC line
                  echo "  // rpc $METHOD ($INPUT_PACKAGE.$INPUT) returns ($OUTPUT_PACKAGE.$OUTPUT);  // Command manually excluded (see COMMANDS_TO_EXCLUDE)" >> "$OUTFILE"
                else
                  # Normal RPC line
                  echo "  rpc $METHOD ($INPUT_PACKAGE.$INPUT) returns ($OUTPUT_PACKAGE.$OUTPUT);" >> "$OUTFILE"
                fi


              done <<< "$RPC_LINES"

              echo "}" >> "$OUTFILE"
              echo >> "$OUTFILE"


              # Write AFTER_IMPORTS
              echo "$AFTER_IMPORTS" >> "$OUTFILE"

            done

          done

      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        if: ${{ steps.folders.outputs.folders != 'none' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Generated rpcproto files after DFHack proto sync (with missing import fixes)" || echo "No changes to commit"
          git push
