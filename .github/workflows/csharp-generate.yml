name: Generate C# After Proto Sync

on:
  workflow_run:
    workflows: ["Monthly Proto Sync"]
    types:
      - completed

permissions:
  contents: write   # Required so git push works

jobs:
  generate-csharp:
    # Only run if Workflow A succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Needed so we can diff against previous commit

      ###############################################################
      # DETERMINE LATEST VERSION FOLDER
      ###############################################################

      - name: Determine latest DFHack version folder
        id: version
        run: |
          VERSION_FOLDER=$(ls -d dfhack-* | sort -V | tail -n 1)
          echo "folder=$VERSION_FOLDER" >> $GITHUB_OUTPUT
          echo "Detected version folder: $VERSION_FOLDER"

      ###############################################################
      # DETERMINE IF ANY RPCPROTO FILES CHANGED
      ###############################################################

      - name: Check for rpcproto changes
        id: changes
        run: |
          VERSION_FOLDER="${{ steps.version.outputs.folder }}"

          # Detect changes in any rpcproto folder inside the version folder
          if git diff --quiet HEAD^ HEAD -- "$VERSION_FOLDER"/*/rpcproto; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No rpcproto changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "rpcproto changes detected"
          fi

      # Stop early if nothing changed
      - name: Stop if no C# generation is needed
        if: ${{ steps.changes.outputs.changed != 'true' }}
        run: echo "Skipping C# generation because no rpcproto changes were detected."

      ###############################################################
      # INSTALL PROTOC + gRPC C# PLUGIN
      ###############################################################

      - name: Install protoc and gRPC C# plugin
        run: |
          PROTOC_VERSION="27.2"
          curl -L -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo apt-get update
          sudo apt-get install -y unzip grpc-tools
          sudo unzip protoc.zip -d /usr/local
          rm protoc.zip

          echo "protoc version:"
          protoc --version

          echo "grpc_csharp_plugin path:"
          which grpc_csharp_plugin

      ###############################################################
      # GENERATE C# FILES FOR ALL RPCPROTO FOLDERS
      ###############################################################

      - name: Generate C# files
        run: |
          VERSION_FOLDER="${{ steps.version.outputs.folder }}"

          # Find all rpcproto folders inside the version folder
          find "$VERSION_FOLDER" -type d -name rpcproto | while read RPCPROTO_PATH; do
            OUTBASE=$(dirname "$RPCPROTO_PATH")

            echo "Generating C# for:"
            echo "  Input proto folder: $RPCPROTO_PATH"
            echo "  Output base:        $OUTBASE/Generated"

            rm -rf "$OUTBASE/Generated" || true
            mkdir -p "$OUTBASE/Generated"

            protoc \
              --proto_path="$RPCPROTO_PATH" \
              --csharp_out="$OUTBASE/Generated" \
              --grpc_out="$OUTBASE/Generated" \
              --plugin=protoc-gen-grpc=$(which grpc_csharp_plugin) \
              "$RPCPROTO_PATH"/*.proto

          done

      ###############################################################
      # COMMIT RESULTS
      ###############################################################

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Generated C# files (messages + gRPC stubs) after rpcproto changes in ${{ steps.version.outputs.folder }}" || echo "No changes to commit"
          git push
          