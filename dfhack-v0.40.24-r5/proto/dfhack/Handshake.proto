syntax = "proto2";

package dfproto;

option optimize_for = LITE_RUNTIME;

// RPC Handshake : HandshakeRequest -> HandshakeReply

message HandshakeRequest {
    required string request_magic = 1;
    required int32 protocol_version = 2;
}


message HandshakeReply {
    required string response_magic = 1;
    required int32 protocol_version = 2;
}

